name: firstday
version: "1.0.0"
profile: firstday

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: target
clean-targets: [target, dbt_packages]

# One schema; table prefixes carry the layer (raw_ -> stg_ -> dim_/fact_).
# Staging and reports are views — they hold rules, not state; the core
# marts are tables for stable, fast reads.
models:
  firstday:
    staging:
      +materialized: view
    marts:
      +materialized: table
      reports:
        +materialized: view
