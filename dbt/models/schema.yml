version: 2

seeds:
  - name: expected_event_names
    description: >
      The event-name contract — single source of truth for valid event_name
      values, shared by the classification model, the schema tests, and
      src/validate.py.
    columns:
      - name: event_name
        description: A valid event type.

models:
  # ---- staging ---------------------------------------------------------

  - name: int_events_classified
    description: >
      Internal staging model, one row per raw_events row (duplicates still
      present). Types every field, flattens `properties`, and assigns at
      most one rejection_reason per row (first failing rule wins).
      stg_events and rejected_events both derive from it.

  - name: stg_events
    description: >
      One row per unique, valid event. All marts read from here; nothing
      downstream re-parses raw JSON.
    columns:
      - name: event_id
        description: Unique event identifier.
        tests: [unique, not_null]
      - name: event_ts
        description: When the user acted (UTC). All date grouping uses this.
        tests: [not_null]
      - name: event_date
        description: Date of event_ts.
      - name: received_ts
        description: When the pipeline received the event (UTC).
      - name: lateness_seconds
        description: received_ts minus event_ts, in seconds.
      - name: is_late
        description: True when the event arrived more than 1 hour after it happened.
      - name: account_id
        description: Owning account; guaranteed to exist in dim_accounts.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: user_id
        description: Acting user; guaranteed to exist in dim_users.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: session_id
        description: Product session; null only for user_invited / user_signed_up.
      - name: event_name
        description: Event type; guaranteed to be in the expected_event_names seed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('expected_event_names')
                field: event_name
      - name: workflow
        description: Product workflow the event belongs to (onboarding, content_review, ...).
      - name: model
        description: AI model name; only on ai_response_generated events.
      - name: prompt_tokens
        description: Prompt tokens of the AI call; non-negative when present.
        tests: [non_negative]
      - name: completion_tokens
        description: Completion tokens of the AI call; non-negative when present.
        tests: [non_negative]
      - name: total_tokens
        description: prompt_tokens + completion_tokens.
      - name: latency_ms
        description: AI call latency in milliseconds.
        tests: [non_negative]
      - name: cost_usd
        description: Cost reported on the event; null when missing (never imputed here).
        tests: [non_negative]
      - name: accepted
        description: Acceptance flag emitted on the generation event itself.
      - name: duration_ms
        description: Workflow duration; only on workflow_completed events.
      - name: prompt_length_chars
        description: Prompt length; only on prompt_submitted events.
      - name: device
        description: Device type; only on session_started events.
      - name: error_code
        description: Error code; only on error_raised events.
      - name: rejected_reason_text
        description: Free-text reason; only on response_rejected events.
      - name: invite_channel
        description: Invite channel; only on user_invited / user_signed_up.
      - name: source_file
        description: Lineage — file the event came from.
      - name: line_number
        description: Lineage — line within source_file.
      - name: ingested_at
        description: Lineage — UTC load timestamp.

  - name: rejected_events
    description: >
      Explainable audit trail of every rejected line or event, across both
      stages — 'ingest' (line never parsed as JSON) and 'staging' (parsed
      but failed a validation rule, or was a duplicate copy).
    columns:
      - name: rejection_stage
        description: "'ingest' (parse failure) or 'staging' (validation failure)."
      - name: rejection_reason
        description: Why the row was rejected (one reason per row, first failing rule).
        tests: [not_null]
      - name: event_id
        description: Event id when the line parsed; null for parse failures.
      - name: event_name
        description: Event name when the line parsed.
      - name: raw_data
        description: The original line or payload, verbatim.
      - name: source_file
        description: Lineage — file the row came from.
        tests: [not_null]
      - name: line_number
        description: Lineage — line within source_file.
        tests: [not_null]
      - name: ingested_at
        description: Lineage — UTC load timestamp.

  # ---- marts -----------------------------------------------------------

  - name: dim_accounts
    description: One row per account.
    columns:
      - name: account_id
        description: Natural key.
        tests: [unique, not_null]
      - name: account_name
        description: Display name.
      - name: plan
        description: Subscription plan (enterprise / growth / starter / pro).
      - name: industry
        description: Account industry.
      - name: seat_limit
        description: Contracted seat limit.
      - name: account_created_at
        description: When the account was created.

  - name: dim_users
    description: One row per user; email masked to domain only (PII).
    columns:
      - name: user_id
        description: Natural key.
        tests: [unique, not_null]
      - name: account_id
        description: Account the user belongs to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: account_name
        description: Denormalized account display name.
      - name: email_masked
        description: Email masked to '***@domain' — full address never leaves the raw layer.
      - name: role
        description: User role (admin / manager / member / ...).
      - name: status
        description: User status (active / invited).
      - name: user_created_at
        description: When the user was created.

  - name: fact_ai_interactions
    description: >
      One row per AI model call (ai_response_generated event), with both
      reported and estimated cost.
    columns:
      - name: interaction_id
        description: The event_id of the generation event.
        tests: [unique, not_null]
      - name: event_ts
        description: When the call happened (UTC).
      - name: event_date
        description: Date of event_ts.
      - name: account_id
        description: Owning account.
      - name: user_id
        description: Acting user.
      - name: session_id
        description: Session the call belongs to.
      - name: workflow
        description: Workflow the call served.
      - name: model
        description: AI model name.
        tests: [not_null]
      - name: prompt_tokens
        description: Prompt tokens.
      - name: completion_tokens
        description: Completion tokens.
      - name: total_tokens
        description: prompt_tokens + completion_tokens.
      - name: latency_ms
        description: Call latency in milliseconds.
        tests: [not_null, non_negative]
      - name: cost_usd
        description: Cost as reported on the event; null when missing.
        tests: [non_negative]
      - name: cost_usd_estimated
        description: >
          cost_usd when known, otherwise imputed as total_tokens x the
          model's observed cost-per-token in this sample.
        tests: [non_negative]
      - name: is_cost_estimated
        description: True when cost_usd_estimated was imputed.
      - name: accepted
        description: Acceptance flag from the generation event; null when not emitted.
      - name: is_late
        description: True when the event arrived more than 1 hour late.

  - name: fact_sessions
    description: >
      One row per session. Owned by the account/user of its earliest event;
      funnel flags mark whether each stage EVER happened (no strict ordering).
    columns:
      - name: session_id
        description: Natural key.
        tests: [unique, not_null]
      - name: account_id
        description: Account of the session's first event.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: user_id
        description: User of the session's first event.
      - name: started_at
        description: Timestamp of the first event in the session.
      - name: ended_at
        description: Timestamp of the last event in the session.
      - name: session_date
        description: Date of started_at (a session crossing midnight counts once).
      - name: workflow
        description: Workflow of the session (max over events; sessions don't mix workflows in this sample).
      - name: event_count
        description: Total valid events in the session.
      - name: prompts_submitted
        description: Count of prompt_submitted events.
      - name: ai_responses
        description: Count of ai_response_generated events.
      - name: responses_accepted
        description: Count of response_accepted events.
      - name: responses_rejected
        description: Count of response_rejected events.
      - name: workflows_completed
        description: Count of workflow_completed events.
      - name: errors_raised
        description: Count of error_raised events.
      - name: total_tokens
        description: Sum of tokens across the session's AI calls.
      - name: cost_usd
        description: Sum of reported cost across the session's AI calls.
      - name: has_session_started
        description: Funnel flag — session_started ever happened.
      - name: has_prompt_submitted
        description: Funnel flag — prompt_submitted ever happened.
      - name: has_ai_response
        description: Funnel flag — ai_response_generated ever happened.
      - name: has_response_accepted
        description: Funnel flag — response_accepted ever happened.
      - name: has_workflow_completed
        description: Funnel flag — workflow_completed ever happened.
      - name: duration_seconds
        description: ended_at minus started_at, in seconds.

  - name: daily_account_metrics
    description: One row per (event_date, account_id) with at least one valid event.
    tests:
      - unique_combination:
          arguments:
            combination: [event_date, account_id]
    columns:
      - name: event_date
        description: Activity date (from event_ts).
      - name: account_id
        description: Account.
      - name: account_name
        description: Denormalized account display name.
      - name: plan
        description: Denormalized subscription plan.
      - name: active_users
        description: Distinct users with at least one valid event that day.
        tests: [not_null, non_negative]
      - name: sessions
        description: Distinct sessions active that day.
      - name: events
        description: Total valid events.
      - name: prompts_submitted
        description: Count of prompt_submitted events.
      - name: ai_interactions
        description: Count of ai_response_generated events.
      - name: responses_accepted
        description: Count of response_accepted events.
      - name: responses_rejected
        description: Count of response_rejected events.
      - name: workflows_completed
        description: Count of workflow_completed events.
      - name: errors_raised
        description: Count of error_raised events.
      - name: ai_total_tokens
        description: Tokens across the day's AI calls.
      - name: ai_cost_usd
        description: Sum of reported cost only; missing costs contribute 0.
        tests: [not_null, non_negative]
      - name: uncosted_interactions
        description: AI calls that day with missing cost_usd (imputed in the estimated column).
      - name: ai_cost_usd_estimated
        description: Reported cost plus per-model imputation for the missing ones.
        tests: [not_null, non_negative]

  # ---- reports (the analytics questions, as views) -----------------------

  - name: rpt_daily_active_users
    description: "Q1 — daily active users by account."
    columns:
      - name: active_users
        description: Distinct users with at least one valid event that day.

  - name: rpt_ai_interactions_by_workflow_model
    description: "Q2 — AI interactions by workflow and model."
    columns:
      - name: ai_interactions
        description: Count of ai_response_generated events.

  - name: rpt_latency_by_model
    description: "Q3 — median and p95 latency by model."
    columns:
      - name: median_latency_ms
        description: Interpolated median latency.
      - name: p95_latency_ms
        description: Interpolated 95th-percentile latency.

  - name: rpt_daily_cost_by_account
    description: "Q4 — daily estimated AI cost by account (reported and imputed)."
    columns:
      - name: ai_cost_usd
        description: Reported cost only.
      - name: ai_cost_usd_estimated
        description: Reported plus per-model imputation for missing costs.

  - name: rpt_session_funnel
    description: >
      Q5 — session conversion funnel; cumulative share of started sessions
      reaching each stage.
    columns:
      - name: stage_order
        description: Funnel position (1-5).
      - name: sessions
        description: Sessions that reached this and all previous stages.
      - name: pct_of_started
        description: Percentage of started sessions.

  - name: rpt_rejected_responses_by_account
    description: "Q6 — top accounts by rejected responses."
    columns:
      - name: rejection_rate_pct
        description: Rejections over explicit accept/reject decisions only.

  - name: rpt_high_error_rate_users
    description: "Q7 — users above mean + 2 sigma error rate (min 10 events)."
    columns:
      - name: threshold_pct
        description: The computed cutoff, included so the flag is auditable.

  - name: rpt_account_usage_growth
    description: "Q8 — event growth, last day vs first day of the sample."
    columns:
      - name: growth_pct
        description: Direction only — three days is not a trend.

  - name: rpt_acceptance_by_model
    description: "Q9 (extra) — acceptance rate by model, with cost and latency."
    columns:
      - name: acceptance_rate_pct
        description: Accepted over calls where the accepted flag is present.
